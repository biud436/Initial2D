# Initial2D 검수 CI (docs/plans/09-testing.md 5절)
# macOS 러너에서 헤드리스(SDL dummy 드라이버 + 소프트웨어 렌더러 폴백)로
# 전체 검수(tests/run_all.sh)를 실행한다. 실패 시 프레임 덤프를 아티팩트로 남긴다.
#
# 러너는 macOS 26 (Tahoe) 이다. Homebrew 의 mruby 4.0.0 병(bottle)이 arm64_tahoe 로만 있어,
# macos-14 에서는 소스 빌드로 떨어지고 그 결과물에 mruby/presym/id.h 가 없어 컴파일이 깨졌다
# (2026-09-26, S1 이후 master 가 붉었던 원인).
name: tests

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  engine-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 의존성 설치
        run: |
          brew install sdl2 sdl2_image sdl2_mixer
          python3 -m pip install --break-system-packages pillow numpy

      # Homebrew 의 mruby 는 병(bottle)에 따라 생성 헤더 mruby/presym/id.h 가 빠져 있을 수 있다
      # (시스템 ruby 2.6 으로 만든 병). 그때는 4.0.0 을 Homebrew ruby 로 소스 빌드해 같은 자리에 둔다.
      - name: mruby 4.0.0 (presym 헤더가 든 빌드)
        run: |
          set -e
          brew install mruby || true
          PREFIX="$(brew --prefix mruby)"
          echo "Homebrew mruby: $PREFIX"
          ls "$PREFIX/include/mruby/presym" || echo "(presym 폴더 없음)"
          if [ ! -f "$PREFIX/include/mruby/presym/id.h" ]; then
            echo "presym/id.h 가 없다. 소스 빌드로 대신한다"
            brew install ruby bison
            export PATH="$(brew --prefix ruby)/bin:$(brew --prefix bison)/bin:$PATH"
            ruby --version
            git clone --depth 1 --branch 4.0.0 https://github.com/mruby/mruby.git /tmp/mruby-src
            cd /tmp/mruby-src
            cp build_config/default.rb homebrew.rb
            sed -i '' "s/conf.gembox 'default'/conf.gembox 'full-core'/" homebrew.rb
            MRUBY_CONFIG="$PWD/homebrew.rb" rake
            ls build/host/include/mruby/presym/
            brew uninstall --ignore-dependencies mruby || true
            rm -rf "$(brew --prefix)/opt/mruby"
            ln -s /tmp/mruby-src/build/host "$(brew --prefix)/opt/mruby"
            "$(brew --prefix)/opt/mruby/bin/mruby-config" --cflags
          fi

      - name: 플레이스홀더 리소스 생성 (gitignore된 최상위 PNG)
        run: python3 tools/generate_placeholder_assets.py

      - name: 전체 검수 (헤드리스)
        run: SDL_VIDEODRIVER=dummy tests/run_all.sh

      - name: 실패 시 프레임 덤프 수집
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frame-dumps
          path: /tmp/initial2d_*.bmp
          if-no-files-found: ignore

  # 웹 빌드 검수 (docs/plans/r3-emscripten.md 10.5). 엔진을 Emscripten 으로 빌드하고 헤드리스 크로미움에서
  # tools/web_smoke.mjs 를 돌린다. 골든(tests/golden/aldebaran_title.png)을 만든 engine-macos 와 같은 러너 계열이라
  # 대조 기준이 같다. 각 단계는 tools/web_ci.sh 의 같은 이름 명령이며 로컬에서도 그대로 돈다.
  # 버전(emsdk 6.0.10, Playwright 1.63.0)은 tools/web_ci.sh 가 고정한다.
  engine-web:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        run: |
          brew install sdl2 sdl2_image sdl2_mixer ruby
          python3 -m pip install --break-system-packages pillow numpy

      # 웹 검수가 같은 파일을 네이티브로도 돌려 오류 줄과 화면을 대조한다 (mruby 포함).
      # engine-macos 의 같은 이름 단계와 같은 절차다.
      - name: mruby 4.0.0 (presym 헤더가 든 빌드)
        run: |
          set -e
          brew install mruby || true
          PREFIX="$(brew --prefix mruby)"
          echo "Homebrew mruby: $PREFIX"
          if [ ! -f "$PREFIX/include/mruby/presym/id.h" ]; then
            echo "presym/id.h 가 없다. 소스 빌드로 대신한다"
            brew install bison
            PATH="$(brew --prefix ruby)/bin:$(brew --prefix bison)/bin:$PATH"
            export PATH
            git clone --depth 1 --branch 4.0.0 https://github.com/mruby/mruby.git /tmp/mruby-src
            cd /tmp/mruby-src
            cp build_config/default.rb homebrew.rb
            sed -i '' "s/conf.gembox 'default'/conf.gembox 'full-core'/" homebrew.rb
            MRUBY_CONFIG="$PWD/homebrew.rb" rake
            brew uninstall --ignore-dependencies mruby || true
            rm -rf "$(brew --prefix)/opt/mruby"
            ln -s /tmp/mruby-src/build/host "$(brew --prefix)/opt/mruby"
          fi

      - name: 플레이스홀더 리소스 생성 (gitignore된 최상위 PNG)
        run: python3 tools/generate_placeholder_assets.py

      # emsdk 와 그 포트 캐시(SDL2 등을 처음 한 번 컴파일한 결과)를 둔다
      - name: emsdk 캐시
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.10

      - name: emsdk
        run: tools/web_ci.sh emsdk

      - name: Playwright (크로미움)
        run: tools/web_ci.sh playwright

      - name: 네이티브 엔진 (대조용)
        run: tools/web_ci.sh native

      - name: 웹 빌드
        run: tools/web_ci.sh build

      - name: 웹 검수 (헤드리스)
        run: tools/web_ci.sh smoke

      - name: 실패 시 캡처 수집
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke
          path: |
            build-web/smoke*.png
            build-web/smoke*.bmp
            build-web/mruby-build.log
          if-no-files-found: ignore

  # 에디터와 LuaLS 용 스텁 검사 (docs/plans/r2-api-stubs.md 10절). 스텁과 .luarc.json 이 명세와 같은지,
  # 저장소의 Lua 스크립트가 .luarc.json 의 규칙으로 경고 없이 읽히는지, RBS 시그니처가 맞는지 본다.
  editor-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: 스텁이 명세와 같은가
        run: python3 tools/gen_api_stubs.py --check

      - name: LuaLS 진단 (경고 이상 0건)
        run: tools/check_luals.sh

      - name: RBS 시그니처 검사
        run: |
          gem install rbs -v 3.8.0 --no-document
          rbs -I resources/api validate
